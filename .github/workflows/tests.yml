name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: python -m pyflakes radarforge tests
      - name: Tests
        run: python -m pytest -q tests

  # runs the real installers the way a user would, from their OS folder
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux installer
        if: runner.os == 'Linux'
        run: |
          bash Linux/install.sh
          ~/.local/bin/radarforge --help
          test -f ~/.local/share/applications/radarforge.desktop
          bash Linux/uninstall.sh < /dev/null
          test ! -e ~/.local/bin/radarforge
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # run the installer exactly as a user would; on failure, surface the end of its output as annotations
          $log = "$env:RUNNER_TEMP\install.log"
          function Fail($what) {
            Get-Content $log -Tail 40 | ForEach-Object { if ($_.Trim()) { Write-Output "::error title=$what::$_" } }
            exit 1
          }
          cmd /c "echo.| Windows\install.bat" *> $log
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 0) { Fail "install.bat exit $code" }
          & "$env:LOCALAPPDATA\RadarForge\venv\Scripts\python.exe" -m radarforge --help *> $log
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 0) { Fail "radarforge --help exit $code" }
          if (-not (Test-Path "$env:LOCALAPPDATA\RadarForge\radarforge.bat")) { "missing radarforge.bat" | Set-Content $log; Fail "launcher" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\RadarForge.lnk")) { "missing Start Menu shortcut" | Set-Content $log; Fail "shortcut" }
