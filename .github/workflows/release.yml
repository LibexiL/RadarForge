name: release

# Builds the Windows installer (RadarForge-Setup-<version>.exe) and the Linux AppImage.
# Runs for every tag like v1.8.0 (and attaches both to that GitHub release), or by hand
# from the Actions tab (then download them from the run's "Artifacts").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build the app folder
        run: pyinstaller --noconfirm packaging/radarforge.spec
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path radarforge/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" packaging/radarforge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/RadarForge-Setup-*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/RadarForge-Setup-*.exe

  linux:
    runs-on: ubuntu-22.04          # older glibc: the AppImage then runs on more distributions
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libfuse2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build the app folder
        run: pyinstaller --noconfirm packaging/radarforge.spec
      - name: Check it starts
        run: dist/RadarForge/RadarForge --help
      - name: Build the AppImage
        run: bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/RadarForge-*.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/RadarForge-*.AppImage
