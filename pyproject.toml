[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "radarforge"
version = "1.9.3"
description = "NEXRAD Level II / Level III weather radar viewer: live and archive data, 1-6 linked panels, derived products, placefiles, cross sections and 3-D"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["weather", "radar", "nexrad", "meteorology", "gr2analyst", "placefile"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "PySide6>=6.5",
  "numpy>=1.24",
  "scipy>=1.10",
  "metpy>=1.5",
  "scikit-image>=0.21",
  "PyOpenGL>=3.1.7",
  "requests>=2.28",
  "pillow>=9",             # GIF export
  "imageio>=2.20",
  "imageio-ffmpeg>=0.4",   # MP4 export (bundles ffmpeg)
  "h5py>=3.0",             # GOES GLM lightning files (netCDF-4)
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]
maps = ["shapely", "geonamescache"]      # only for rebuilding the basemap (tools/build_maps.py)

[project.scripts]
radarforge = "radarforge.app:main"

[tool.setuptools.packages.find]
include = ["radarforge*"]

[tool.setuptools.package-data]
radarforge = ["assets/*", "data/sites.json", "products/palettes/*.pal"]
